# CI for thesis_auto_generator
# Runs the test suite and the environment check the generator needs.
#
# Scope note, verified on 2026-10-05: check_env.py:151-162 decides "dependency
# installed" by calling importlib.import_module on each name in requirements.txt.
# gradio is in that file, but gradio 4.44 imports huggingface_hub's HfFolder, which
# was removed in hub >= 1.0. So a clean runner resolves hub to the newest release,
# the import raises ImportError, and check_env.py reports "gradio 未安装" even though
# gradio is present and pip says it is installed. Pinning the transitive dependency
# to the last pre-1.0 release is what makes this repository's own check able to pass.
# requirements.txt should pin it too; that is a repository change, reported here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # gradio 4.44 -> huggingface_hub<1.0 (HfFolder was removed in 1.0)
          pip install 'huggingface_hub<1.0'
      - name: Run the test suite
        run: python -m pytest -q
      - name: check_env.py
        run: python check_env.py

  mutation-control:
    # Proves the environment gate can fail: with the pinned hub removed, the gradio
    # import breaks and check_env.py must exit non-zero. Without this the pin above
    # would be an untested claim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies exactly as the verify job does
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'huggingface_hub<1.0'
      - name: Break the gradio import and require check_env.py to fail
        shell: bash
        run: |
          set -euo pipefail
          # Roll hub forward to the version whose API gradio 4.44 cannot use.
          python -m pip install --upgrade 'huggingface_hub>=1.0' >/dev/null
          if python check_env.py; then
            echo 'FAIL: check_env.py still passed with an unimportable gradio'
            exit 1
          fi
          echo 'OK: check_env.py detected the broken dependency'

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
